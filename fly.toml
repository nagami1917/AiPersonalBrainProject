# NEXUS API + worker on Fly.io.
#
# One app, two process groups, one image: web and worker are deployed atomically
# so they can never run different code versions (docs/DEVELOPMENT.md §4).
#
# primary_region must match the Supabase project region.
# "sin" (Singapore) is chosen for a PH-based user; change both together.

app = "nexus-api"
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"
  PORT = "8000"

[processes]
  # API: keep one machine warm so the first chat after idle is not a cold start.
  web = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
  # Worker: long-running queue consumer. Must never scale to zero.
  worker = "python -m app.workers.main"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

# The worker has no HTTP surface; a dead worker is visible through missing
# heartbeats in logs and stalled jobs in the queue, which is the honest signal.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
