# CI gates, as specified in docs/DEVELOPMENT.md §6.
#
# Two jobs, deliberately separate:
#
#   * `checks` needs nothing but Python and Node. It is fast, and it is what a
#     contributor sees first.
#   * `database` runs the schema, RLS and retrieval suites against a real
#     Postgres with pgvector. Those tests were being *skipped* locally whenever
#     DATABASE_URL was unset, which meant the tenancy boundary — the one thing
#     expensive to retrofit — had no gate at all.
#
# Both are blocking. `database` uses the `pgvector/pgvector` image rather than
# the stock `postgres` one because migration 0003 declares `vector(1536)` and
# creates an HNSW index; a stock image fails on migration 0001 and every later
# test would be meaningless.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Tests must never reach a real provider or a real Supabase project.
  ENVIRONMENT: test
  SUPABASE_URL: http://127.0.0.1:54321
  SUPABASE_ANON_KEY: test-anon
  SUPABASE_SERVICE_ROLE_KEY: test-service
  SUPABASE_JWT_SECRET: test-secret-with-at-least-32-characters-long
  OPENAI_API_KEY: test-key
  CI: "true"

jobs:
  checks:
    name: lint · types · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install backend deps
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff
        working-directory: apps/api
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: mypy
        working-directory: apps/api
        run: mypy app

      - name: unit tests
        working-directory: apps/api
        run: pytest -q tests/unit

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend deps
        working-directory: apps/web
        run: npm ci

      - name: frontend unit tests
        working-directory: apps/web
        run: npm run test -- --silent

      - name: svelte-check
        working-directory: apps/web
        run: npm run check

      - name: build
        working-directory: apps/web
        run: npm run build

      - name: deployment env configuration
        # Exercises the checker against a known-good set: a check that has never
        # passed is as untrustworthy as one that has never failed. The database
        # column comparison is skipped here (SKIP_DB_CHECK) because this job has
        # no database; the `database` job runs it for real.
        env:
          SKIP_DB_CHECK: "1"
        run: |
          env -i PATH="$PATH" \
            SUPABASE_URL=https://example.supabase.co SUPABASE_ANON_KEY=x \
            SUPABASE_SERVICE_ROLE_KEY=x \
            SUPABASE_JWT_SECRET=$(printf 'x%.0s' {1..40}) \
            DATABASE_URL=postgresql://u:p@h/db OPENAI_API_KEY=x \
            CORS_ALLOWED_ORIGINS=https://app.example \
            PUBLIC_SUPABASE_URL=https://example.supabase.co \
            PUBLIC_SUPABASE_ANON_KEY=x \
            API_BASE_URL=https://nexus-api.fly.dev \
            ./scripts/check-env.sh

      - name: no secrets in the frontend bundle
        # The build output is the one artifact that ships to a browser. A
        # service-role key or AI key appearing here is a security bug, not a
        # configuration choice (ARCHITECTURE.md §3).
        working-directory: apps/web
        run: |
          if grep -rlE "SUPABASE_SERVICE_ROLE_KEY|OPENAI_API_KEY|AI_API_KEY|DATABASE_URL" \
               .svelte-kit/output/client/ .vercel/output/static/ 2>/dev/null; then
            echo "::error::a secret-like variable name appears in the client bundle"
            exit 1
          fi
          echo "no secret-like names in the client bundle"

  database:
    name: migrations · RLS · retrieval
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector is required by migration 0003, not optional.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The API's own config requires these; they never leave the runner.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexus
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install backend deps
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Create the Supabase-equivalent surface
        # Supabase provides roles, the auth/storage schemas and their helper
        # functions. A bare Postgres does not, and the migrations depend on them
        # exactly as they do in production. This is the same prelude the local
        # harness uses; it is test scaffolding, not application code.
        run: |
          psql -v ON_ERROR_STOP=1 -d nexus <<'SQL'
            do $$
            begin
              if not exists (select 1 from pg_roles where rolname = 'anon') then
                create role anon nologin noinherit;
              end if;
              if not exists (select 1 from pg_roles where rolname = 'authenticated') then
                create role authenticated nologin noinherit;
              end if;
              if not exists (select 1 from pg_roles where rolname = 'service_role') then
                create role service_role nologin noinherit bypassrls;
              end if;
            end
            $$;

            create schema if not exists auth;
            create table if not exists auth.users (
              id uuid primary key default gen_random_uuid(),
              email text unique,
              raw_user_meta_data jsonb default '{}'::jsonb,
              created_at timestamptz not null default now()
            );
            create or replace function auth.uid() returns uuid language sql stable as $$
              select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid;
            $$;
            create or replace function auth.role() returns text language sql stable as $$
              select coalesce(nullif(current_setting('request.jwt.claim.role', true), ''), 'anon');
            $$;

            create schema if not exists storage;
            create table if not exists storage.buckets (
              id text primary key, name text not null,
              public boolean not null default false,
              file_size_limit bigint, allowed_mime_types text[]
            );
            create table if not exists storage.objects (
              id uuid primary key default gen_random_uuid(),
              bucket_id text references storage.buckets(id),
              name text not null, owner uuid, metadata jsonb,
              created_at timestamptz not null default now()
            );
            alter table storage.objects enable row level security;
            create or replace function storage.foldername(name text) returns text[]
              language sql immutable as $$ select string_to_array(name, '/'); $$;
            create or replace function storage.filename(name text) returns text
              language sql immutable as $$
                select (string_to_array(name, '/'))[array_length(string_to_array(name, '/'), 1)];
              $$;
          SQL

      - name: Apply migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "→ $f"
            psql -v ON_ERROR_STOP=1 -q -d nexus -f "$f"
          done

      - name: Assert no migration was skipped
        # The suite is only meaningful if every migration ran. Comparing the
        # file count against the recorded schema version catches a migration
        # that silently did nothing.
        run: |
          applied=$(psql -tAc "select count(*) from information_schema.tables
                               where table_schema = 'public' and table_type = 'BASE TABLE'")
          echo "public tables: $applied"
          if [ "$applied" -lt 15 ]; then
            echo "::error::expected at least 15 public tables, found $applied — a migration did not run"
            exit 1
          fi

      - name: Seed
        run: psql -v ON_ERROR_STOP=1 -q -d nexus -f supabase/seed.sql

      - name: Raw tenancy assertions
        run: psql -v ON_ERROR_STOP=1 -q -d nexus -f supabase/tests/tenancy.sql

      - name: database tests
        working-directory: apps/api
        run: pytest -q tests/db
